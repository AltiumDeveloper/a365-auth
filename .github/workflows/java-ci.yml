name: Java CI

# Runs only when the Java library or the shared spec/vectors change.
on:
  push:
    branches: [main]
    paths:
      - "libs/java/**"
      - "spec/**"
      - ".github/workflows/java-ci.yml"
  pull_request:
    paths:
      - "libs/java/**"
      - "spec/**"
      - ".github/workflows/java-ci.yml"

defaults:
  run:
    working-directory: libs/java

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]
    name: Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Unit, transport, and conformance tests against the shared vectors in spec/, plus a javadoc lint.
      - run: ./mvnw -B verify javadoc:javadoc

      # Compile the live E2E tool so API changes can't silently break it (it isn't a test).
      - run: javac -Xlint:all -Werror -cp target/classes -d target/tools tools/SignInTest.java
