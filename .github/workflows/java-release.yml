name: Java Release

# Publishes libs/java (com.altium:altium-auth) to Maven Central when a tag like
# `java-v0.2.1` is pushed. Needs a Central Portal user token (MAVEN_CENTRAL_USERNAME,
# MAVEN_CENTRAL_PASSWORD) and an armored GPG signing key (MAVEN_GPG_PRIVATE_KEY,
# MAVEN_GPG_PASSPHRASE) as secrets of the `maven` environment.
on:
  push:
    tags:
      - "java-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven
    permissions:
      contents: read
    defaults:
      run:
        working-directory: libs/java
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}

      - name: Check the tag matches the pom version
        run: test "${GITHUB_REF_NAME#java-v}" = "$(grep -m1 -oP '(?<=<version>)[^<]+' pom.xml)"

      # deploy runs the full test suite (including conformance) before anything is uploaded.
      - run: ./mvnw -B -Prelease deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
