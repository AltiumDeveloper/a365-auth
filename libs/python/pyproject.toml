[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "altium-auth"
version = "0.2.0"
description = "Altium 365 OAuth2/OIDC authentication with PKCE and the ActionWait desktop flow. Zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Altium Limited" }]
keywords = ["altium", "altium365", "a365", "oauth2", "oidc", "pkce", "authentication", "sso", "token-exchange"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AltiumDeveloper/altium-auth/tree/main/libs/python#readme"
Repository = "https://github.com/AltiumDeveloper/altium-auth"
Issues = "https://github.com/AltiumDeveloper/altium-auth/issues"
Documentation = "https://altiumdeveloper.github.io/altium-auth/"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/altium_auth"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"tools/**" = ["S101", "T201", "S105", "S106"]
"src/altium_auth/endpoints.py" = ["S106"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
